<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouVideos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f0f0f; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #212121; height: 56px; z-index: 100; gap: 10px; }
    .logo { font-size: 18px; font-weight: bold; color: #ff0000; text-decoration: none; }
    .search-bar { display: flex; flex: 1; max-width: 300px; }
    .search-bar input { width: 100%; padding: 6px 10px; background: #121212; border: 1px solid #303030; color: #fff; border-radius: 20px 0 0 20px; outline: none; font-size: 13px; }
    .search-bar button { padding: 6px 12px; background: #303030; border: none; color: #fff; border-radius: 0 20px 20px 0; cursor: pointer; }
    .upload-btn { background: #ff0000; color: #fff; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer; white-space: nowrap; }

    .nav-tabs { display: flex; gap: 10px; padding: 8px 16px; background: #0f0f0f; border-bottom: 1px solid #272727; height: 48px; }
    .tab-btn { background: #272727; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .tab-btn.active { background: #fff; color: #000; font-weight: bold; }

    main { flex: 1; overflow-y: auto; position: relative; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 16px; }
    .card { background: #181818; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .card video { width: 100%; height: 200px; background: #000; object-fit: contain; }
    .card-info { padding: 12px; }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .actions-bar { display: flex; gap: 12px; align-items: center; font-size: 13px; color: #aaa; margin-bottom: 10px; }
    .action-btn { background: #272727; border: none; color: #fff; padding: 4px 10px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .action-btn.active { background: #ff0000; }
    
    .comments-section { border-top: 1px solid #272727; padding-top: 8px; margin-top: 8px; }
    .comments-list { max-height: 100px; overflow-y: auto; font-size: 12px; margin-bottom: 6px; display: flex; flex-direction: column; gap: 4px; }
    .comment-item { background: #222; padding: 4px 8px; border-radius: 4px; }
    .add-comment { display: flex; gap: 4px; }
    .add-comment input { flex: 1; background: #121212; border: 1px solid #303030; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; outline: none; }
    .add-comment button { background: #303030; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }

    .shorts-container { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; }
    .short-slide { height: 100%; width: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
    .short-slide video { width: 100%; height: 100%; object-fit: cover; }
    
    .short-sidebar { position: absolute; right: 12px; bottom: 80px; display: flex; flex-direction: column; gap: 16px; align-items: center; z-index: 10; }
    .short-btn { background: rgba(0, 0, 0, 0.5); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; }
    .short-btn.active { color: #ff0000; }
    .short-btn span { font-size: 10px; margin-top: 2px; }
    .short-info { position: absolute; left: 12px; bottom: 20px; z-index: 10; max-width: 75%; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .short-title { font-size: 14px; font-weight: bold; }

    .comments-modal { display: none; position: absolute; bottom: 0; left: 0; width: 100%; height: 60%; background: #181818; border-radius: 16px 16px 0 0; z-index: 20; padding: 16px; flex-direction: column; }
    .comments-modal.active { display: flex; }
    .comments-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: bold; }
    .close-comments { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }

    .upload-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 200; padding: 16px; }
    .modal-content { background: #212121; padding: 20px; border-radius: 12px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
    .modal-content h3 { font-size: 16px; }
    .modal-content input, .modal-content select { padding: 8px; background: #121212; border: 1px solid #303030; color: #fff; border-radius: 6px; font-size: 13px; width: 100%; }
    .modal-actions { display: flex; gap: 8px; margin-top: 8px; }
    .modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-submit { background: #ff0000; color: #fff; }
    .btn-cancel { background: #303030; color: #fff; }
    #statusText { font-size: 11px; color: #aaa; text-align: center; }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">YouVideos</a>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Пошук..." oninput="render()">
      <button onclick="render()">🔍</button>
    </div>
    <button class="upload-btn" onclick="openModal()">+ Додати</button>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" id="btn-regular" onclick="switchTab('regular')">Відео</button>
    <button class="tab-btn" id="btn-shorts" onclick="switchTab('shorts')">Shorts</button>
  </div>

  <main id="mainContent"></main>

  <div class="upload-modal" id="uploadModal">
    <div class="modal-content">
      <h3>Додати відео</h3>
      <input type="text" id="videoTitle" placeholder="Назва відео">
      <select id="videoType">
        <option value="regular">Звичайне відео</option>
        <option value="shorts">Shorts</option>
      </select>
      <input type="file" id="videoFile" accept="video/*">
      <div id="statusText"></div>
      <div class="modal-actions">
        <button class="btn-submit" id="btnUpload" onclick="handleUpload()">Зберегти</button>
        <button class="btn-cancel" onclick="closeModal()">Скасувати</button>
      </div>
    </div>
  </div>

  <script>
    let videos = JSON.parse(localStorage.getItem('yv_videos') || '[]');
    let currentTab = 'regular';
    let activeShortCommentsIndex = null;

    function saveState() {
      localStorage.setItem('yv_videos', JSON.stringify(videos));
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('btn-regular').classList.toggle('active', tab === 'regular');
      document.getElementById('btn-shorts').classList.toggle('active', tab === 'shorts');
      render();
    }

    function render() {
      const main = document.getElementById('mainContent');
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      let filtered = videos.filter(v => v.type === currentTab);
      if (query) {
        filtered = filtered.filter(v => v.title.toLowerCase().includes(query));
      }

      if (currentTab === 'regular') {
        renderRegular(main, filtered);
      } else {
        renderShorts(main, filtered);
      }
    }

    function renderRegular(container, list) {
      if (list.length === 0) {
        container.innerHTML = '<p style="color:#aaa; padding:16px;">Відео відсутні. Натисніть «+ Додати»!</p>';
        return;
      }

      let html = '<div class="grid">';
      list.forEach(v => {
        const index = videos.indexOf(v);
        html += `
          <div class="card">
            <video src="${v.url}" controls preload="metadata"></video>
            <div class="card-info">
              <div class="card-title">${v.title}</div>
              <div class="actions-bar">
                <button class="action-btn ${v.liked ? 'active' : ''}" onclick="toggleLike(${index})">
                  👍 <span>${v.likes || 0}</span>
                </button>
                <button class="action-btn ${v.disliked ? 'active' : ''}" onclick="toggleDislike(${index})">
                  👎 <span>${v.dislikes || 0}</span>
                </button>
              </div>
              <div class="comments-section">
                <div class="comments-list">
                  ${(v.comments || []).map(c => `<div class="comment-item">${c}</div>`).join('')}
                </div>
                <div class="add-comment">
                  <input type="text" id="input-com-${index}" placeholder="Коментар...">
                  <button onclick="addComment(${index})">ОК</button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function renderShorts(container, list) {
      if (list.length === 0) {
        container.innerHTML = '<p style="color:#aaa; padding:16px;">Shorts відсутні. Натисніть «+ Додати»!</p>';
        return;
      }

      let html = '<div class="shorts-container">';
      list.forEach(v => {
        const index = videos.indexOf(v);
        html += `
          <div class="short-slide">
            <video src="${v.url}" loop playsinline onclick="togglePlay(this)"></video>
            <div class="short-info">
              <div class="short-title">${v.title}</div>
            </div>
            <div class="short-sidebar">
              <button class="short-btn ${v.liked ? 'active' : ''}" onclick="toggleLike(${index})">
                👍<span>${v.likes || 0}</span>
              </button>
              <button class="short-btn ${v.disliked ? 'active' : ''}" onclick="toggleDislike(${index})">
                👎<span>${v.dislikes || 0}</span>
              </button>
              <button class="short-btn" onclick="openShortComments(${index})">
                💬<span>${(v.comments || []).length}</span>
              </button>
            </div>
          </div>
        `;
      });

      html += `
        <div class="comments-modal" id="shortCommentsModal">
          <div class="comments-header">
            <span>Коментарі</span>
            <button class="close-comments" onclick="closeShortComments()">✕</button>
          </div>
          <div class="comments-list" id="shortCommentsList" style="flex:1;"></div>
          <div class="add-comment" style="margin-top:8px;">
            <input type="text" id="shortCommentInput" placeholder="Ваш коментар...">
            <button onclick="addShortComment()">Надіслати</button>
          </div>
        </div>
      </div>`;

      container.innerHTML = html;
      initShortsObserver();
    }

    function initShortsObserver() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (video) {
            if (entry.isIntersecting) {
              video.play().catch(() => {});
            } else {
              video.pause();
              video.currentTime = 0;
            }
          }
        });
      }, { threshold: 0.6 });

      document.querySelectorAll('.short-slide').forEach(slide => observer.observe(slide));
    }

    function togglePlay(video) {
      if (video.paused) video.play();
      else video.pause();
    }

    function toggleLike(index) {
      const v = videos[index];
      if (!v.likes) v.likes = 0;
      if (!v.dislikes) v.dislikes = 0;

      if (v.liked) {
        v.liked = false;
        v.likes--;
      } else {
        v.liked = true;
        v.likes++;
        if (v.disliked) {
          v.disliked = false;
          v.dislikes--;
        }
      }
      saveState();
      render();
    }

    function toggleDislike(index) {
      const v = videos[index];
      if (!v.likes) v.likes = 0;
      if (!v.dislikes) v.dislikes = 0;

      if (v.disliked) {
        v.disliked = false;
        v.dislikes--;
      } else {
        v.disliked = true;
        v.dislikes++;
        if (v.liked) {
          v.liked = false;
          v.likes--;
        }
      }
      saveState();
      render();
    }

    function addComment(index) {
      const input = document.getElementById(`input-com-${index}`);
      const text = input.value.trim();
      if (!text) return;

      if (!videos[index].comments) videos[index].comments = [];
      videos[index].comments.push(text);
      saveState();
      render();
    }

    function openShortComments(index) {
      activeShortCommentsIndex = index;
      const modal = document.getElementById('shortCommentsModal');
      const list = document.getElementById('shortCommentsList');
      const comments = videos[index].comments || [];

      list.innerHTML = comments.map(c => `<div class="comment-item">${c}</div>`).join('') || '<p style="color:#aaa;">Немає коментарів</p>';
      modal.classList.add('active');
    }

    function closeShortComments() {
      const modal = document.getElementById('shortCommentsModal');
      if (modal) modal.classList.remove('active');
      activeShortCommentsIndex = null;
    }

    function addShortComment() {
      if (activeShortCommentsIndex === null) return;
      const input = document.getElementById('shortCommentInput');
      const text = input.value.trim();
      if (!text) return;

      if (!videos[activeShortCommentsIndex].comments) videos[activeShortCommentsIndex].comments = [];
      videos[activeShortCommentsIndex].comments.push(text);
      saveState();
      openShortComments(activeShortCommentsIndex);
      input.value = '';
    }

    function handleUpload() {
      const title = document.getElementById('videoTitle').value.trim();
      const type = document.getElementById('videoType').value;
      const fileInput = document.getElementById('videoFile');
      const file = fileInput.files[0];
      const statusText = document.getElementById('statusText');
      const btnUpload = document.getElementById('btnUpload');

      if (!title || !file) {
        alert('Введіть назву та оберіть файл!');
        return;
      }

      btnUpload.disabled = true;
      statusText.innerText = 'Конвертація відео...';

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result;
        videos.unshift({ 
          title, 
          type, 
          url: base64Data, 
          likes: 0, 
          dislikes: 0, 
          comments: [] 
        });
        
        saveState();
        closeModal();
        render();

        btnUpload.disabled = false;
        statusText.innerText = '';
      };
      reader.onerror = function() {
        alert('Помилка читання файлу');
        btnUpload.disabled = false;
        statusText.innerText = '';
      };
      reader.readAsDataURL(file);
    }

    function openModal() { document.getElementById('uploadModal').style.display = 'flex'; }
    function closeModal() { 
      document.getElementById('uploadModal').style.display = 'none'; 
      document.getElementById('videoTitle').value = '';
      document.getElementById('videoFile').value = '';
      document.getElementById('statusText').innerText = '';
    }

    render();
  </script>
</body>
</html>
