<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouVideos</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f0f0f; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #212121; position: sticky; top: 0; z-index: 100; gap: 10px; }
    .logo { font-size: 18px; font-weight: bold; color: #ff0000; text-decoration: none; }
    .search-bar { display: flex; flex: 1; max-width: 400px; }
    .search-bar input { width: 100%; padding: 8px 12px; background: #121212; border: 1px solid #303030; color: #fff; border-radius: 20px 0 0 20px; outline: none; font-size: 14px; }
    .search-bar button { padding: 8px 14px; background: #303030; border: none; color: #fff; border-radius: 0 20px 20px 0; cursor: pointer; }
    
    .upload-btn { background: #ff0000; color: #fff; border: none; padding: 8px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; white-space: nowrap; }

    .nav-tabs { display: flex; gap: 10px; padding: 12px 16px; background: #0f0f0f; border-bottom: 1px solid #272727; }
    .tab-btn { background: #272727; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .tab-btn.active { background: #fff; color: #000; font-weight: bold; }

    main { padding: 16px; flex: 1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: #181818; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .card video { width: 100%; height: 200px; object-fit: cover; background: #000; }
    .card-info { padding: 12px; }
    .card-title { font-size: 15px; font-weight: 600; line-height: 1.3; }

    /* Shorts стилі */
    .shorts-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .shorts-card video { height: 280px; object-fit: cover; }

    /* Модальне вікно */
    .upload-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 200; padding: 16px; }
    .modal-content { background: #212121; padding: 20px; border-radius: 12px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
    .modal-content h3 { font-size: 18px; margin-bottom: 4px; }
    .modal-content input, .modal-content select { padding: 10px; background: #121212; border: 1px solid #303030; color: #fff; border-radius: 6px; font-size: 14px; width: 100%; }
    .modal-actions { display: flex; gap: 8px; margin-top: 8px; }
    .modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-submit { background: #ff0000; color: #fff; }
    .btn-cancel { background: #303030; color: #fff; }
    #statusText { font-size: 12px; color: #aaa; text-align: center; }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">YouVideos</a>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Пошук..." oninput="searchVideos()">
      <button onclick="searchVideos()">🔍</button>
    </div>
    <button class="upload-btn" onclick="openModal()">+ Додати</button>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" id="btn-regular" onclick="switchTab('regular')">Відео</button>
    <button class="tab-btn" id="btn-shorts" onclick="switchTab('shorts')">Shorts</button>
  </div>

  <main>
    <div id="videoContainer" class="grid"></div>
  </main>

  <div class="upload-modal" id="uploadModal">
    <div class="modal-content">
      <h3>Завантаження відео</h3>
      <input type="text" id="videoTitle" placeholder="Назва відео">
      <select id="videoType">
        <option value="regular">Звичайне відео</option>
        <option value="shorts">Shorts</option>
      </select>
      <label style="font-size: 12px; color: #ccc;">Оберіть відеофайл (до 900 МБ):</label>
      <input type="file" id="videoFile" accept="video/*">
      <div id="statusText"></div>
      <div class="modal-actions">
        <button class="btn-submit" id="btnUpload" onclick="uploadVideo()">Опублікувати</button>
        <button class="btn-cancel" onclick="closeModal()">Скасувати</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nhmfvavtfislsacrzsfw.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_G-m6iVhyeTiYi3GVj5Tx_Q_DE4oI-oq';
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentTab = 'regular';

    // ДЕМО-ВІДЕО (з'являться одразу, якщо база порожня або немає з'єднання)
    const fallbackVideos = [
      { id: 1, title: 'Тестове звичайне відео 1', type: 'regular', video_url: 'https://www.w3schools.com/html/mov_bbb.mp4' },
      { id: 2, title: 'Тестове звичайне відео 2', type: 'regular', video_url: 'https://www.w3schools.com/html/movie.mp4' },
      { id: 3, title: 'Тестовий Short 1', type: 'shorts', video_url: 'https://www.w3schools.com/html/mov_bbb.mp4' }
    ];

    async function loadVideos(query = '') {
      const container = document.getElementById('videoContainer');
      container.innerHTML = '<p style="color:#aaa;">Завантаження...</p>';

      let data = [];
      try {
        let req = db.from('videos').select('*').eq('type', currentTab).order('created_at', { ascending: false });
        if (query) req = req.ilike('title', `%${query}%`);
        
        const res = await req;
        if (!res.error && res.data && res.data.length > 0) {
          data = res.data;
        } else {
          // Якщо в базі нічого немає — беремо демонстраційні приклади для зручності
          data = fallbackVideos.filter(v => v.type === currentTab);
        }
      } catch (err) {
        // Якщо пропав інтернет — все одно показуємо заготовлені приклади
        data = fallbackVideos.filter(v => v.type === currentTab);
      }

      if (query) {
        data = data.filter(v => v.title.toLowerCase().includes(query.toLowerCase()));
      }

      if (data.length === 0) {
        container.innerHTML = '<p style="color:#aaa;">Відео не знайдено.</p>';
        return;
      }

      container.className = currentTab === 'shorts' ? 'grid shorts-grid' : 'grid';
      container.innerHTML = '';

      data.forEach(v => {
        const card = document.createElement('div');
        card.className = currentTab === 'shorts' ? 'card shorts-card' : 'card';
        card.innerHTML = `
          <video src="${v.video_url}" controls preload="metadata"></video>
          <div class="card-info">
            <div class="card-title">${v.title}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function uploadVideo() {
      const title = document.getElementById('videoTitle').value.trim();
      const type = document.getElementById('videoType').value;
      const fileInput = document.getElementById('videoFile');
      const file = fileInput.files[0];
      const statusText = document.getElementById('statusText');
      const btnUpload = document.getElementById('btnUpload');

      if (!title || !file) {
        alert('Заповніть назву та виберіть відеофайл!');
        return;
      }

      // ЛІМІТ: 900 МБ
      const MAX_SIZE_BYTES = 900 * 1024 * 1024;
      if (file.size > MAX_SIZE_BYTES) {
        alert('Файл занадто великий! Максимальний розмір відео — 900 МБ.');
        return;
      }

      btnUpload.disabled = true;
      statusText.innerText = 'Завантаження файлу...';

      const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
      const { data: storageData, error: storageErr } = await db.storage.from('videos').upload(fileName, file);

      if (storageErr) {
        alert('Помилка завантаження файлу: ' + storageErr.message);
        statusText.innerText = '';
        btnUpload.disabled = false;
        return;
      }

      statusText.innerText = 'Збереження в базу...';

      const { data: urlData } = db.storage.from('videos').getPublicUrl(fileName);

      const { error: dbErr } = await db.from('videos').insert([{
        title: title,
        type: type,
        video_url: urlData.publicUrl
      }]);

      if (dbErr) {
        alert('Помилка збереження запису: ' + dbErr.message);
      } else {
        alert('Успішно опубліковано!');
        closeModal();
        loadVideos();
      }

      statusText.innerText = '';
      btnUpload.disabled = false;
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('btn-regular').classList.toggle('active', tab === 'regular');
      document.getElementById('btn-shorts').classList.toggle('active', tab === 'shorts');
      loadVideos();
    }

    function searchVideos() {
      const q = document.getElementById('searchInput').value;
      loadVideos(q);
    }

    function openModal() { 
      document.getElementById('uploadModal').style.display = 'flex'; 
    }
    
    function closeModal() { 
      document.getElementById('uploadModal').style.display = 'none'; 
      document.getElementById('videoTitle').value = '';
      document.getElementById('videoFile').value = '';
      document.getElementById('statusText').innerText = '';
    }

    loadVideos();
  </script>
</body>
</html>
