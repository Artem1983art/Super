<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouVideos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f0f0f; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* Шапка */
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #212121; height: 56px; z-index: 100; gap: 10px; }
    .logo { font-size: 18px; font-weight: bold; color: #ff0000; text-decoration: none; cursor: pointer; }
    .search-bar { display: flex; flex: 1; max-width: 300px; }
    .search-bar input { width: 100%; padding: 6px 10px; background: #121212; border: 1px solid #303030; color: #fff; border-radius: 20px 0 0 20px; outline: none; font-size: 13px; }
    .search-bar button { padding: 6px 12px; background: #303030; border: none; color: #fff; border-radius: 0 20px 20px 0; cursor: pointer; }
    
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .user-badge { font-size: 12px; background: #303030; padding: 4px 10px; border-radius: 12px; color: #ddd; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-btn { background: none; border: 1px solid #ff0000; color: #ff0000; padding: 4px 8px; border-radius: 12px; font-size: 11px; cursor: pointer; }
    .upload-btn { background: #ff0000; color: #fff; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer; white-space: nowrap; }

    /* Таби */
    .nav-tabs { display: flex; gap: 10px; padding: 8px 16px; background: #0f0f0f; border-bottom: 1px solid #272727; height: 48px; }
    .tab-btn { background: #272727; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .tab-btn.active { background: #fff; color: #000; font-weight: bold; }

    main { flex: 1; overflow-y: auto; position: relative; }
    
    /* Сітка звичайних відео */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 16px; }
    .card { background: #181818; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; position: relative; }
    .thumbnail-box { width: 100%; height: 160px; background: #000; position: relative; display: flex; justify-content: center; align-items: center; }
    .thumbnail-box video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .card-info { padding: 12px; display: flex; justify-content: space-between; align-items: flex-start; }
    .card-title { font-size: 14px; font-weight: 600; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-author { font-size: 12px; color: #aaa; margin-top: 4px; }
    
    /* Кнопка видалення відео на картці */
    .delete-card-btn { background: rgba(255, 0, 0, 0.8); color: #fff; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; margin-top: 4px; z-index: 5; }

    /* Сторінка перегляду відео */
    .watch-container { padding: 16px; display: flex; flex-direction: column; gap: 12px; height: 100%; overflow-y: auto; }
    .back-btn { background: #272727; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; width: fit-content; }
    .main-video-player { width: 100%; max-height: 400px; background: #000; border-radius: 12px; object-fit: contain; }
    .watch-title { font-size: 18px; font-weight: bold; }
    .watch-details { display: flex; justify-content: space-between; align-items: center; color: #aaa; font-size: 13px; border-bottom: 1px solid #272727; padding-bottom: 12px; }
    .watch-actions { display: flex; gap: 12px; align-items: center; }
    
    .action-btn { background: #272727; border: none; color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 14px; }
    .action-btn.active { background: #ff0000; }

    /* Коментарі */
    .comments-area { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .comments-title { font-size: 15px; font-weight: bold; }
    .comments-list { display: flex; flex-direction: column; gap: 8px; }
    .comment-item { background: #1a1a1a; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: #ddd; }
    .comment-author { font-weight: bold; color: #ff0000; font-size: 11px; margin-bottom: 2px; }
    .add-comment-box { display: flex; gap: 8px; margin-top: 4px; }
    .add-comment-box input { flex: 1; background: #121212; border: 1px solid #303030; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none; }
    .add-comment-box button { background: #303030; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; }

    /* Shorts Стрічка */
    .shorts-container { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; }
    .short-slide { height: 100%; width: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
    .short-slide video { width: 100%; height: 100%; object-fit: cover; }
    
    .short-sidebar { position: absolute; right: 12px; bottom: 80px; display: flex; flex-direction: column; gap: 16px; align-items: center; z-index: 10; }
    .short-btn { background: rgba(0, 0, 0, 0.5); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; }
    .short-btn.active { color: #ff0000; }
    .short-btn span { font-size: 10px; margin-top: 2px; }
    .short-info { position: absolute; left: 12px; bottom: 20px; z-index: 10; max-width: 70%; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .short-title { font-size: 14px; font-weight: bold; }
    .short-author { font-size: 12px; color: #ccc; margin-top: 4px; }

    /* Модалка коментарів для Shorts */
    .comments-modal { display: none; position: absolute; bottom: 0; left: 0; width: 100%; height: 60%; background: #181818; border-radius: 16px 16px 0 0; z-index: 20; padding: 16px; flex-direction: column; }
    .comments-modal.active { display: flex; }
    .comments-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: bold; }
    .close-comments { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }

    /* Модалки (Реєстрація та Завантаження) */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 200; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #212121; padding: 20px; border-radius: 12px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
    .modal-content h3 { font-size: 16px; }
    .modal-content input, .modal-content select { padding: 8px; background: #121212; border: 1px solid #303030; color: #fff; border-radius: 6px; font-size: 13px; width: 100%; }
    .modal-actions { display: flex; gap: 8px; margin-top: 8px; }
    .modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-submit { background: #ff0000; color: #fff; }
    .btn-cancel { background: #303030; color: #fff; }
    #statusText { font-size: 11px; color: #aaa; text-align: center; }
  </style>
</head>
<body>

  <!-- Модальне вікно Реєстрації / Входу -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-content">
      <h3>Ласкаво просимо в YouVideos</h3>
      <p style="font-size: 12px; color: #aaa;">Введіть назву свого каналу, щоб почати перегляд та публікацію відео.</p>
      <input type="text" id="regUsernameInput" placeholder="Ваше ім'я або канал...">
      <button class="btn-submit" onclick="handleRegister()">Увійти / Зареєструватися</button>
    </div>
  </div>

  <header>
    <a class="logo" onclick="goHome()">YouVideos</a>
    <div class="search-bar" id="searchBarContainer">
      <input type="text" id="searchInput" placeholder="Пошук..." oninput="render()">
      <button onclick="render()">🔍</button>
    </div>
    <div class="header-actions">
      <span class="user-badge" id="currentUserBadge"></span>
      <button class="logout-btn" onclick="logout()">Вийти</button>
      <button class="upload-btn" onclick="openUploadModal()">+ Додати</button>
    </div>
  </header>

  <div class="nav-tabs" id="navTabsContainer">
    <button class="tab-btn active" id="btn-regular" onclick="switchTab('regular')">Відео</button>
    <button class="tab-btn" id="btn-shorts" onclick="switchTab('shorts')">Shorts</button>
  </div>

  <main id="mainContent"></main>

  <!-- Модальне вікно завантаження відео -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal-content">
      <h3>Додати відео</h3>
      <input type="text" id="videoTitle" placeholder="Назва відео">
      <select id="videoType">
        <option value="regular">Звичайне відео</option>
        <option value="shorts">Shorts</option>
      </select>
      <input type="file" id="videoFile" accept="video/*">
      <div id="statusText"></div>
      <div class="modal-actions">
        <button class="btn-submit" id="btnUpload" onclick="handleUpload()">Зберегти</button>
        <button class="btn-cancel" onclick="closeUploadModal()">Скасувати</button>
      </div>
    </div>
  </div>

  <script>
    let db;
    let currentUser = localStorage.getItem('yv_current_user') || '';
    let videos = JSON.parse(localStorage.getItem('yv_videos_meta') || '[]');
    let videoUrls = {}; 
    let currentTab = 'regular';
    let viewingVideoId = null; 
    let activeShortCommentsId = null;

    // Перевірка реєстрації при запуску
    window.onload = function() {
      if (!currentUser) {
        document.getElementById('authModal').classList.add('active');
      } else {
        updateUserBadge();
      }
    };

    function handleRegister() {
      const input = document.getElementById('regUsernameInput');
      const name = input.value.trim();
      if (!name) {
        alert('Будь ласка, введіть ім'я каналу!');
        return;
      }
      currentUser = name;
      localStorage.setItem('yv_current_user', currentUser);
      document.getElementById('authModal').classList.remove('active');
      updateUserBadge();
      render();
    }

    function logout() {
      localStorage.removeItem('yv_current_user');
      currentUser = '';
      document.getElementById('regUsernameInput').value = '';
      document.getElementById('authModal').classList.add('active');
    }

    function updateUserBadge() {
      document.getElementById('currentUserBadge').innerText = '@' + currentUser;
    }

    // База даних IndexedDB для важких відео
    const request = indexedDB.open('YouVideosDB', 1);
    request.onerror = () => console.error('Помилка БД');
    request.onsuccess = (event) => {
      db = event.target.result;
      loadAllVideosFromDB();
    };
    request.onupgradeneeded = (event) => {
      db = event.target.result;
      if (!db.objectStoreNames.contains('videos')) {
        db.createObjectStore('videos', { keyPath: 'id' });
      }
    };

    function saveMeta() {
      const lightMeta = videos.map(v => ({ 
        id: v.id, title: v.title, type: v.type, author: v.author,
        likes: v.likes, dislikes: v.dislikes, 
        liked: v.liked, disliked: v.disliked, 
        comments: v.comments 
      }));
      localStorage.setItem('yv_videos_meta', JSON.stringify(lightMeta));
    }

    function loadAllVideosFromDB() {
      if (!db) return;
      const transaction = db.transaction(['videos'], 'readonly');
      const store = transaction.objectStore('videos');
      
      videos.forEach(v => {
        const req = store.get(v.id);
        req.onsuccess = (event) => {
          if (event.target.result && event.target.result.blob) {
            videoUrls[v.id] = URL.createObjectURL(event.target.result.blob);
            render();
          }
        };
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      viewingVideoId = null;
      document.getElementById('btn-regular').classList.toggle('active', tab === 'regular');
      document.getElementById('btn-shorts').classList.toggle('active', tab === 'shorts');
      render();
    }

    function goHome() {
      viewingVideoId = null;
      render();
    }

    function render() {
      if (!currentUser) return;
      const main = document.getElementById('mainContent');
      const searchContainer = document.getElementById('searchBarContainer');
      const tabsContainer = document.getElementById('navTabsContainer');

      if (viewingVideoId) {
        searchContainer.style.display = 'none';
        tabsContainer.style.display = 'none';
        renderWatchView(main, viewingVideoId);
        return;
      }

      searchContainer.style.display = 'flex';
      tabsContainer.style.display = 'flex';

      const query = document.getElementById('searchInput').value.toLowerCase();
      let filtered = videos.filter(v => v.type === currentTab);
      if (query) {
        filtered = filtered.filter(v => v.title.toLowerCase().includes(query));
      }

      if (currentTab === 'regular') {
        renderRegularGrid(main, filtered);
      } else {
        renderShorts(main, filtered);
      }
    }

    function renderRegularGrid(container, list) {
      if (list.length === 0) {
        container.innerHTML = '<p style="color:#aaa; padding:16px;">Відео відсутні. Натисніть «+ Додати»!</p>';
        return;
      }

      let html = '<div class="grid">';
      list.forEach(v => {
        const url = videoUrls[v.id] || '';
        const isMyVideo = v.author === currentUser;
        html += `
          <div class="card">
            <div class="thumbnail-box" onclick="openWatchView('${v.id}')">
              <video src="${url}" preload="metadata"></video>
            </div>
            <div class="card-info">
              <div onclick="openWatchView('${v.id}')" style="flex:1; cursor:pointer;">
                <div class="card-title">${v.title}</div>
                <div class="card-author">${v.author || 'Анонім'}</div>
              </div>
              ${isMyVideo ? `<button class="delete-card-btn" onclick="deleteVideo('${v.id}')">Видалити</button>` : ''}
            </div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function openWatchView(id) {
      viewingVideoId = id;
      render();
    }

    function renderWatchView(container, id) {
      const v = videos.find(item => item.id === id);
      if (!v) { goHome(); return; }
      const url = videoUrls[v.id] || '';
      const isMyVideo = v.author === currentUser;

      container.innerHTML = `
        <div class="watch-container">
          <button class="back-btn" onclick="goHome()">← Назад</button>
          <video class="main-video-player" src="${url}" controls autoplay preload="auto"></video>
          <div class="watch-title">${v.title}</div>
          <div class="watch-details">
            <span>Канал: <b>${v.author || 'Анонім'}</b></span>
            <div class="watch-actions">
              <button class="action-btn ${v.liked ? 'active' : ''}" onclick="toggleLikeMeta('${v.id}')">
                👍 <span>${v.likes || 0}</span>
              </button>
              <button class="action-btn ${v.disliked ? 'active' : ''}" onclick="toggleDislikeMeta('${v.id}')">
                👎 <span>${v.dislikes || 0}</span>
              </button>
              ${isMyVideo ? `<button class="delete-card-btn" style="padding:8px 12px;" onclick="deleteVideo('${v.id}'); goHome();">Видалити відео</button>` : ''}
            </div>
          </div>
          <div class="comments-area">
            <div class="comments-title">Коментарі (${(v.comments || []).length})</div>
            <div class="add-comment-box">
              <input type="text" id="watchCommentInput" placeholder="Введіть коментар...">
              <button onclick="addWatchComment('${v.id}')">ОК</button>
            </div>
            <div class="comments-list">
              ${(v.comments || []).map(c => `
                <div class="comment-item">
                  <div class="comment-author">@${c.author}</div>
                  <div>${c.text}</div>
                </div>
              `).join('') || '<p style="color:#aaa; font-size:13px;">Ще немає коментарів</p>'}
            </div>
          </div>
        </div>
      `;
    }

    function renderShorts(container, list) {
      if (list.length === 0) {
        container.innerHTML = '<p style="color:#aaa; padding:16px;">Shorts відсутні. Натисніть «+ Додати»!</p>';
        return;
      }

      let html = '<div class="shorts-container">';
      list.forEach(v => {
        const url = videoUrls[v.id] || '';
        const isMyVideo = v.author === currentUser;
        html += `
          <div class="short-slide">
            <video src="${url}" loop playsinline onclick="togglePlay(this)"></video>
            <div class="short-info">
              <div class="short-title">${v.title}</div>
              <div class="short-author">@${v.author || 'Анонім'}</div>
            </div>
            <div class="short-sidebar">
              <button class="short-btn ${v.liked ? 'active' : ''}" onclick="toggleLikeMeta('${v.id}')">
                👍<span>${v.likes || 0}</span>
              </button>
              <button class="short-btn ${v.disliked ? 'active' : ''}" onclick="toggleDislikeMeta('${v.id}')">
                👎<span>${v.dislikes || 0}</span>
              </button>
              <button class="short-btn" onclick="openShortComments('${v.id}')">
                💬<span>${(v.comments || []).length}</span>
              </button>
              ${isMyVideo ? `<button class="short-btn" style="background:rgba(255,0,0,0.8);" onclick="deleteVideo('${v.id}')">🗑️</button>` : ''}
            </div>
          </div>
        `;
      });

      html += `
        <div class="comments-modal" id="shortCommentsModal">
          <div class="comments-header">
            <span>Коментарі</span>
            <button class="close-comments" onclick="closeShortComments()">✕</button>
          </div>
          <div class="comments-list" id="shortCommentsList" style="flex:1; overflow-y:auto;"></div>
          <div class="add-comment-box" style="margin-top:8px;">
            <input type="text" id="shortCommentInput" placeholder="Ваш коментар...">
            <button onclick="addShortComment()">Надіслати</button>
          </div>
        </div>
      </div>`;

      container.innerHTML = html;
      initShortsObserver();
    }

    function initShortsObserver() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (video) {
            if (entry.isIntersecting) {
              video.play().catch(() => {});
            } else {
              video.pause();
              video.currentTime = 0;
            }
          }
        });
      }, { threshold: 0.6 });

      document.querySelectorAll('.short-slide').forEach(slide => observer.observe(slide));
    }

    function togglePlay(video) {
      if (video.paused) video.play();
      else video.pause();
    }

    function toggleLikeMeta(id) {
      const v = videos.find(item => item.id === id);
      if (!v) return;
      if (!v.likes) v.likes = 0;
      if (!v.dislikes) v.dislikes = 0;

      if (v     if (v.liked) {
      v.liked = false;
      v.likes--;
    } else {
      v.liked = true;
      v.likes++;
      if (v.disliked) {
        v.disliked = false;
        v.dislikes--;
      }
    }
    saveMeta();
    render();
  }

  function toggleDislikeMeta(id) {
    const v = videos.find(item => item.id === id);
    if (!v) return;
    if (!v.likes) v.likes = 0;
    if (!v.dislikes) v.dislikes = 0;

    if (v.disliked) {
      v.disliked = false;
      v.dislikes--;
    } else {
      v.disliked = true;
      v.dislikes++;
      if (v.liked) {
        v.liked = false;
        v.likes--;
      }
    }
    saveMeta();
    render();
  }

  function addWatchComment(id) {
    const input = document.getElementById('watchCommentInput');
    const text = input.value.trim();
    if (!text) return;
    const v = videos.find(item => item.id === id);
    if (!v) return;

    if (!v.comments) v.comments = [];
    v.comments.push({ author: currentUser, text: text });
    saveMeta();
    render();
  }

  function openShortComments(id) {
    activeShortCommentsId = id;
    const modal = document.getElementById('shortCommentsModal');
    const list = document.getElementById('shortCommentsList');
    const v = videos.find(item => item.id === id);
    const comments = v && v.comments ? v.comments : [];

    list.innerHTML = comments.map(c => `
      <div class="comment-item">
        <div class="comment-author">@${c.author}</div>
        <div>${c.text}</div>
      </div>
    `).join('') || '<p style="color:#aaa;">Немає коментарів</p>';
    modal.classList.add('active');
  }

  function closeShortComments() {
    document.getElementById('shortCommentsModal').classList.remove('active');
    activeShortCommentsId = null;
  }

  function addShortComment() {
    if (!activeShortCommentsId) return;
    const input = document.getElementById('shortCommentInput');
    const text = input.value.trim();
    if (!text) return;
    const v = videos.find(item => item.id === activeShortCommentsId);
    if (!v) return;

    if (!v.comments) v.comments = [];
    v.comments.push({ author: currentUser, text: text });
    saveMeta();
    openShortComments(activeShortCommentsId);
    input.value = '';
  }

  function deleteVideo(id) {
    if (!confirm('Видалити це відео?')) return;
    
    videos = videos.filter(v => v.id !== id);
    saveMeta();

    if (db) {
      const tx = db.transaction(['videos'], 'readwrite');
      tx.objectStore('videos').delete(id);
    }

    delete videoUrls[id];
    goHome();
  }

  function handleUpload() {
    const title = document.getElementById('videoTitle').value.trim();
    const type = document.getElementById('videoType').value;
    const fileInput = document.getElementById('videoFile');
    const file = fileInput.files[0];
    const statusText = document.getElementById('statusText');
    const btnUpload = document.getElementById('btnUpload');

    if (!title || !file) {
      alert('Введіть назву та оберіть файл!');
      return;
    }

    btnUpload.disabled = true;
    statusText.innerText = 'Збереження у пам`ять...';

    const videoId = 'vid_' + Date.now();
    const transaction = db.transaction(['videos'], 'readwrite');
    const store = transaction.objectStore('videos');
    store.put({ id: videoId, blob: file });

    transaction.oncomplete = function() {
      videoUrls[videoId] = URL.createObjectURL(file);
      
      videos.unshift({ 
        id: videoId, 
        title, 
        type, 
        author: currentUser,
        likes: 0, 
        dislikes: 0, 
        comments: [] 
      });
      
      saveMeta();
      closeUploadModal();
      render();

      btnUpload.disabled = false;
      statusText.innerText = '';
    };

    transaction.onerror = function() {
      alert('Помилка збереження файлу');
      btnUpload.disabled = false;
      statusText.innerText = '';
    };
  }

  function openUploadModal() { document.getElementById('uploadModal').classList.add('active'); }
  function closeUploadModal() { 
    document.getElementById('uploadModal').classList.remove('active'); 
    document.getElementById('videoTitle').value = '';
    document.getElementById('videoFile').value = '';
    document.getElementById('statusText').innerText = '';
  }
</script>
</body>
</html>
